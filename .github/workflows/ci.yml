name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev pkg-config
      - name: Unit tests
        run: cargo test -p ereshkigal-core --lib
      - name: Build CLI
        run: cargo build -p ereshkigal --release

  smoke-gguf:
    runs-on: ubuntu-latest
    needs: lib
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev pkg-config
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Read smoke manifest
        id: smoke
        run: |
          FILE=$(python3 -c "import json; print(json.load(open('manifests/ci-smoke.json'))['gguf']['file'])")
          REPO=$(python3 -c "import json; print(json.load(open('manifests/ci-smoke.json'))['gguf']['repo'])")
          SHA=$(python3 -c "import json; print(json.load(open('manifests/ci-smoke.json'))['gguf']['sha256'])")
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Cache GGUF
        uses: actions/cache@v4
        with:
          path: models/${{ steps.smoke.outputs.file }}
          key: gguf-${{ steps.smoke.outputs.sha }}
      - name: Download smoke GGUF
        run: |
          mkdir -p models
          if [[ ! -f "models/${{ steps.smoke.outputs.file }}" ]]; then
            pip install -q huggingface_hub
            python3 - <<'PY'
          from huggingface_hub import hf_hub_download
          import shutil, json
          from pathlib import Path
          m = json.load(open("manifests/ci-smoke.json"))
          path = hf_hub_download(m["gguf"]["repo"], m["gguf"]["file"])
          dest = Path("models") / m["gguf"]["file"]
          shutil.copy2(path, dest)
          print(dest, dest.stat().st_size)
          PY
          fi
          echo "${{ steps.smoke.outputs.sha }}  models/${{ steps.smoke.outputs.file }}" | sha256sum -c -
      - name: Smoke parity test
        env:
          ERESHKIGAL_GGUF: ${{ github.workspace }}/models/${{ steps.smoke.outputs.file }}
          ERESHKIGAL_SMOKE: "1"
        run: |
          cargo test -p ereshkigal-core --test parity_gguf -- --nocapture
