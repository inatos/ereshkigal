name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_gpu:
        description: "Print GPU bench instructions (no hosted GPU)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

    jobs:
  lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev pkg-config
      - name: Lang tests
        run: cargo test -p ereshkigal-lang --lib
      - name: Lang wasm32
        run: cargo check -p ereshkigal-lang --target wasm32-unknown-unknown
      - name: Unit tests
        run: cargo test -p ereshkigal-core --lib
      - name: Build CLI
        run: cargo build -p ereshkigal --release
      - name: Check decrees
        run: ./target/release/ereshkigal check decrees
      - name: Prompt hash parity
        run: node --input-type=module -e "import {createHash} from 'crypto'; import {readFileSync} from 'fs'; import {renderDirect} from './webgpu-demo/prompt.mjs';"
      - name: Python client import
        run: python3 -c "import ast, pathlib; ast.parse(pathlib.Path('ereshkigal-py/python/ereshkigal/client.py').read_text())"

  smoke-gguf:
    runs-on: ubuntu-latest
    needs: lib
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev pkg-config
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Read smoke manifest
        id: smoke
        run: |
          FILE=$(python3 -c "import json; print(json.load(open('manifests/ci-smoke.json'))['gguf']['file'])")
          REPO=$(python3 -c "import json; print(json.load(open('manifests/ci-smoke.json'))['gguf']['repo'])")
          SHA=$(python3 -c "import json; print(json.load(open('manifests/ci-smoke.json'))['gguf']['sha256'])")
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Cache GGUF
        uses: actions/cache@v4
        with:
          path: models/${{ steps.smoke.outputs.file }}
          key: gguf-${{ steps.smoke.outputs.sha }}
      - name: Download smoke GGUF
        run: |
          mkdir -p models
          if [[ ! -f "models/${{ steps.smoke.outputs.file }}" ]]; then
            pip install -q huggingface_hub
            python3 - <<'PY'
          from huggingface_hub import hf_hub_download
          import shutil, json
          from pathlib import Path
          m = json.load(open("manifests/ci-smoke.json"))
          path = hf_hub_download(m["gguf"]["repo"], m["gguf"]["file"])
          dest = Path("models") / m["gguf"]["file"]
          shutil.copy2(path, dest)
          print(dest, dest.stat().st_size)
          PY
          fi
          echo "${{ steps.smoke.outputs.sha }}  models/${{ steps.smoke.outputs.file }}" | sha256sum -c -
      - name: Smoke parity test
        env:
          ERESHKIGAL_GGUF: ${{ github.workspace }}/models/${{ steps.smoke.outputs.file }}
          ERESHKIGAL_SMOKE: "1"
        run: |
          cargo test -p ereshkigal-core --test parity_gguf -- --nocapture
      - name: Smoke language tests
        env:
          ERESHKIGAL_GGUF: ${{ github.workspace }}/models/${{ steps.smoke.outputs.file }}
        run: |
          cargo build -p ereshkigal --release
          ./target/release/ereshkigal test --lib decrees --split dev --gguf "$ERESHKIGAL_GGUF" || true
          ./target/release/ereshkigal test --lib decrees --split all
      - name: SemIf venv + 3-row same-GGUF A/B
        env:
          ERESHKIGAL_GGUF: ${{ github.workspace }}/models/${{ steps.smoke.outputs.file }}
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          ./scripts/setup_semif_venv.sh
          SEMIF_VENV=.venv-semif
          "$SEMIF_VENV/bin/pytest" vendor/SemIf-OpenJev/tests/test_core.py vendor/SemIf-OpenJev/tests/test_cli.py vendor/SemIf-OpenJev/tests/test_calibrate.py -q
          BIN=./target/release/semif-score LLAMA_THREADS=8 AB_MAX_DP=1e-6 \
            ./scripts/ab_llamacpp.sh models/${{ steps.smoke.outputs.file }} examples/decisions.jsonl

  gpu-bench:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_gpu == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GPU bench is self-hosted
        run: |
          echo "This workflow has no GPU runner."
          echo "On a CUDA host: cargo build -p ereshkigal --release --features cuda"
          echo "N_GPU_LAYERS=999 ./scripts/bench_shape.sh models/Qwen3.5-4B-Q4_K_M.gguf"
          echo "See docs/NOVEL.md"
