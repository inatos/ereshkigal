[package]
name = "ereshkigal"
description = "CLI for Ereshkigal semantic decision scoring (semif-score compatible)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "semif-score"
path = "src/main.rs"

[[bin]]
name = "ereshkigal"
path = "src/cli.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
ereshkigal-core.workspace = true
lsp-server.workspace = true
lsp-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tiny_http = { workspace = true, optional = true }

[features]
default = []
cuda = ["ereshkigal-core/cuda"]
vulkan = ["ereshkigal-core/vulkan"]
metal = ["ereshkigal-core/metal"]
http = ["tiny_http"]
