schema = "ereshkigal.decree/v1"
recipe = "direct-options-v1"

[decrees.promote_hold]
question = "Does the evidence support promoting this change?"
kind = "enum"
options = [
  { id = "promote", description = "Evidence is enough to promote the change." },
  { id = "hold", description = "Evidence says to hold the change." },
  { id = "insufficient", description = "The evidence is insufficient to decide." },
]
abstain = { coverage = 0.8 }
on_abstain = "return"

[[decrees.promote_hold.tests]]
state = "Cast metrics passed. Filmstrip read found no contradictions. The author accepted the take."
expect = "promote"
group = "betwixt-promote-1"
split = "dev"

[[decrees.promote_hold.tests]]
state = "A test already fails on the main path. No new measurement contradicts that failure."
expect = "hold"
group = "betwixt-promote-1"
split = "dev"

[[decrees.promote_hold.tests]]
state = "The change is described only as a feeling. No test, capture, or read was recorded."
expect = "insufficient"
group = "betwixt-promote-1"
split = "dev"

[decrees.compute_peer]
question = "Where should this compact compute request run?"
kind = "enum"
options = [
  { id = "remote_copper", description = "The remote peer is healthy and should take the request." },
  { id = "local_host", description = "Run on the local host. The peer is down, busy, or the work is a frame gate." },
  { id = "insufficient", description = "Peer health was not checked." },
]
abstain = { coverage = 0.8 }
on_abstain = "return"

[[decrees.compute_peer.tests]]
state = "copper_status peer up, infer daemon up, lane ready, cooldown false. The request is a short score, not a frame timing gate."
expect = "remote_copper"
group = "betwixt-peer-1"
split = "dev"

[[decrees.compute_peer.tests]]
state = "The peer is down. This is a desktop frame timing capture and must stay on the local display."
expect = "local_host"
group = "betwixt-peer-1"
split = "dev"

[[decrees.compute_peer.tests]]
state = "No health file was read. Nobody checked whether the peer is up."
expect = "insufficient"
group = "betwixt-peer-1"
split = "dev"

[decrees.capture_named]
question = "Did this capture name its profiler zones?"
kind = "enum"
options = [
  { id = "zones_named", description = "The zone table has named rows." },
  { id = "zones_missing", description = "Export failed or the zone table is empty." },
  { id = "insufficient", description = "No capture report was provided." },
]
abstain = { coverage = 0.8 }
on_abstain = "return"

[[decrees.capture_named.tests]]
state = "tracy-csvexport exited 0 and the zone table lists PipelineTick and RenderSubmit."
expect = "zones_named"
group = "betwixt-capture-1"
split = "dev"

[[decrees.capture_named.tests]]
state = "Frames-per-second JSON passed. tracy-csvexport crashed and the zone table is empty."
expect = "zones_missing"
group = "betwixt-capture-1"
split = "dev"

[[decrees.capture_named.tests]]
state = "No capture file, no export log, and no zone table were attached."
expect = "insufficient"
group = "betwixt-capture-1"
split = "dev"

[decrees.memory_salience]
question = "What should Elucifia do with this exchange?"
kind = "enum"
options = [
  { id = "promote_semantic", description = "The exchange states canon or a lasting fact. Write semantic memory." },
  { id = "record_episodic", description = "The exchange is a session decision worth an episodic note." },
  { id = "ephemeral_skip", description = "Greeting, thanks, or chatter. Do not write Lorekeep." },
]
abstain = { coverage = 0.8 }
on_abstain = "return"

[[decrees.memory_salience.tests]]
state = "Inatos confirmed canon: Fulcanus is the Edict master. Record it as a lasting fact."
expect = "promote_semantic"
group = "betwixt-memory-1"
split = "dev"

[[decrees.memory_salience.tests]]
state = "We decided in this session to keep frame gates on the desktop. Note the decision."
expect = "record_episodic"
group = "betwixt-memory-1"
split = "dev"

[[decrees.memory_salience.tests]]
state = "The user said thanks. No fact and no decision."
expect = "ephemeral_skip"
group = "betwixt-memory-1"
split = "dev"

[decrees.continuity_check]
question = "Does this claim agree with the retrieved canon?"
kind = "enum"
options = [
  { id = "consistent", description = "The claim agrees with retrieved canon." },
  { id = "contradiction_flag", description = "The claim contradicts a pinned fact." },
  { id = "spoiler_violation", description = "The claim would reveal past the spoiler horizon." },
  { id = "insufficient", description = "Retrieved canon is not enough to judge." },
]
abstain = { coverage = 0.8 }
on_abstain = "return"

[[decrees.continuity_check.tests]]
state = "Pinned canon says Fulcanus is the Edict master. The proposed beat says the same."
expect = "consistent"
group = "betwixt-continuity-1"
split = "dev"

[[decrees.continuity_check.tests]]
state = "Pinned canon says Ehtria is the spelling. The proposed beat spells it Ethria as the only form."
expect = "contradiction_flag"
group = "betwixt-continuity-1"
split = "dev"

[[decrees.continuity_check.tests]]
state = "Draft horizon is Wispfire chapter 2. The beat reveals a Wispfire chapter 4 secret."
expect = "spoiler_violation"
group = "betwixt-continuity-1"
split = "dev"

[[decrees.continuity_check.tests]]
state = "No pinned page was retrieved. The beat is only a hunch."
expect = "insufficient"
group = "betwixt-continuity-1"
split = "dev"

[decrees.conduit_route]
question = "Which existing organ should own this request?"
kind = "enum"
options = [
  { id = "vault_lorekeep", description = "Lore, continuity, or Atheneum prose." },
  { id = "arte_author", description = "Author or juxtapose feel, look, or sound content." },
  { id = "akasha_source", description = "Find a CC0 mesh, texture, HDRI, or audio pack." },
  { id = "palaestra_gpu_job", description = "Train, lift, image, mesh, or speech on the laptop." },
  { id = "megistus_perf_soak", description = "A measured hitch or frame-time question." },
  { id = "engine_ecs_edit", description = "A data-oriented engine change with a test." },
]
abstain = { coverage = 0.8 }
on_abstain = "return"

[[decrees.conduit_route.tests]]
state = "Inatos wants a Wispfire scene checked against the Atheneum before any new fact."
expect = "vault_lorekeep"
group = "betwixt-route-1"
split = "dev"

[[decrees.conduit_route.tests]]
state = "Author a new impact flash and juxtapose it in Arte. No new downloader."
expect = "arte_author"
group = "betwixt-route-1"
split = "dev"

[[decrees.conduit_route.tests]]
state = "Need a CC0 lantern mesh that is not already in the repo."
expect = "akasha_source"
group = "betwixt-route-1"
split = "dev"

[[decrees.conduit_route.tests]]
state = "Train the persona adapter on the laptop GPU and leave frame timing on the desktop."
expect = "palaestra_gpu_job"
group = "betwixt-route-1"
split = "dev"

[[decrees.conduit_route.tests]]
state = "Spawn motion-soak hitch. Need Tracy zones before any engine edit."
expect = "megistus_perf_soak"
group = "betwixt-route-1"
split = "dev"

[[decrees.conduit_route.tests]]
state = "Add a cached Flecs query in the movement system and cover it with a unit test."
expect = "engine_ecs_edit"
group = "betwixt-route-1"
split = "dev"

[decrees.lora_curate]
question = "Should this pair enter Elucifia's training set?"
kind = "enum"
options = [
  { id = "accept_sft", description = "A real reply worth supervised fine-tuning." },
  { id = "accept_dpo_correction", description = "Inatos rewrote the reply. Keep the preference pair." },
  { id = "reject_noise_or_stub", description = "Thanks, chatter, or a peer-silent stub." },
]
abstain = { coverage = 0.8 }
on_abstain = "return"

[[decrees.lora_curate.tests]]
state = "Inatos confirmed canon and Seraphina answered in her own voice. Not a stub."
expect = "accept_sft"
group = "betwixt-lora-1"
split = "dev"

[[decrees.lora_curate.tests]]
state = "Inatos rewrote the assistant line. Keep the rejected draft and the chosen line."
expect = "accept_dpo_correction"
group = "betwixt-lora-1"
split = "dev"

[[decrees.lora_curate.tests]]
state = "The assistant said peer silent and did not invent a Gemma answer."
expect = "reject_noise_or_stub"
group = "betwixt-lora-1"
split = "dev"

[decrees.frontier_job_partition]
question = "How should this frontier / 1M-context request be partitioned across Tifantell and Myridos?"
kind = "enum"
options = [
  { id = "local_semif_fast", description = "Short judgment: keep on local Ereshkigal SemIf (Qwen3-0.6B/4B)." },
  { id = "myridos_gemma_single", description = "Single-turn chat or mid model: Myridos gemma4:12b/26b via Aeron." },
  { id = "sharded_moe_dag", description = "Large context or multi-mission: OOM-fenced ModularJobDag + TensorPipe shards." },
  { id = "hold_oom_risk", description = "Vitals fail the OOM fence; refuse to size the shard." },
]
abstain = { coverage = 0.8 }
on_abstain = "return"

[[decrees.frontier_job_partition.tests]]
state = "Three option labels, conformal margin high, copper peer up. This is a short promote_hold score, not a frame gate."
expect = "local_semif_fast"
group = "betwixt-frontier-1"
split = "dev"

[[decrees.frontier_job_partition.tests]]
state = "Peer up, infer daemon up. User wants a normal Seraphina chat reply with gemma4:12b. Context under 8k tokens."
expect = "myridos_gemma_single"
group = "betwixt-frontier-1"
split = "dev"

[[decrees.frontier_job_partition.tests]]
state = "Request spans 1M tokens of vault plus a multi-mission Anima and Arte CAD probe. MemAvailable and free VRAM clear the OOM fence on both hosts."
expect = "sharded_moe_dag"
group = "betwixt-frontier-1"
split = "dev"

[[decrees.frontier_job_partition.tests]]
state = "Frontier MoE shard requested but nvidia-smi shows only 1 GiB free VRAM on Tifantell. OOM fence floors are not met."
expect = "hold_oom_risk"
group = "betwixt-frontier-1"
split = "dev"

[programs.capture_proceed]
nodes = [
  { id = "named", decree = "capture_named" },
]
result = [
  { when = ["zones_named"], then = "proceed" },
  { when = ["zones_missing"], then = "hold" },
  { when = ["insufficient"], then = "hold" },
]
