[workspace]
resolver = "2"
members = [
    "ereshkigal-core",
    "ereshkigal",
]
default-members = ["ereshkigal"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
publish = false
authors = ["inatos"]
repository = "https://github.com/inatos/ereshkigal"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
ereshkigal-core = { path = "ereshkigal-core" }
hf-hub = { version = "0.4", default-features = true }
llama-cpp-2 = "0.1.158"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tokenizers = "0.21"
hex = "0.4"
