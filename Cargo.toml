[workspace]
resolver = "2"
members = [
    "ereshkigal-lang",
    "ereshkigal-core",
    "ereshkigal",
    "ereshkigal-wasm",
    "ereshkigal-py",
]
default-members = ["ereshkigal"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
publish = false
authors = ["inatos"]
repository = "https://github.com/inatos/ereshkigal"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
ereshkigal-core = { path = "ereshkigal-core" }
ereshkigal-lang = { path = "ereshkigal-lang" }
tiny_http = "0.12"
lsp-server = "0.7"
lsp-types = "0.97"
minijinja = "2"
pyo3 = { version = "0.23", features = ["abi3-py310"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
hf-hub = { version = "0.4", default-features = true }
llama-cpp-2 = "0.1.158"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tokenizers = "0.21"
hex = "0.4"
tree-sitter = "0.25"
tree-sitter-json = "0.24"
